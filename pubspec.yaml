name: nabawi_maps
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  xml: ^6.6.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  geolocator: ^13.0.1  # ── لزر موقعي الحالي ──

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
flutter:

  uses-material-design: true

  assets:
    - assets/kml/locations.kml
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"