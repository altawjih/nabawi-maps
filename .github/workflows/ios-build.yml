name: iOS Build and Upload

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}

      - name: Install Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE_BASE64" | tr -d '\n\r ' | base64 -d > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Sign and Create IPA
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          IDENTITY="Apple Distribution: Dakhel Alotaibi (9FQNP4F4PN)"
          
          cp profile.mobileprovision "$APP_PATH/embedded.mobileprovision"
          
          security cms -D -i profile.mobileprovision > decoded_profile.plist
          /usr/libexec/PlistBuddy -c "Print :Entitlements" decoded_profile.plist -x > entitlements.plist
          
          find "$APP_PATH" -name "*.dylib" | xargs -I {} /usr/bin/codesign --force --sign "$IDENTITY" {}
          find "$APP_PATH/Frameworks" -maxdepth 1 -name "*.framework" | xargs -I {} /usr/bin/codesign --force --sign "$IDENTITY" {}
          /usr/bin/codesign --force --sign "$IDENTITY" --entitlements entitlements.plist "$APP_PATH"
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -r NabawiMaps.ipa Payload

      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: NabawiMaps.ipa
          issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NabawiMaps-iOS-Signed
          path: NabawiMaps.ipa
          retention-days: 30
